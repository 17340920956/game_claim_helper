version: '3.8'

services:
  app:
    # 如果要使用 Docker Hub 镜像，请取消注释下一行并注释 build: .
    # image: your_dockerhub_username/game_claim_helper:latest
    build: .
    container_name: game_claim_helper
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 数据库连接字符串示例 (请在 .env 中配置)
      # DATABASE_URL=mysql+pymysql://user:password@host:port/dbname
      # REDIS_URL=redis://:password@host:port/db
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - EPIC_FREE_GAMES_URL=${EPIC_FREE_GAMES_URL}
      - WECHAT_OFFICIAL_APPID=${WECHAT_OFFICIAL_APPID}
      - WECHAT_OFFICIAL_SECRET=${WECHAT_OFFICIAL_SECRET}
      - WECHAT_OFFICIAL_TOKEN=${WECHAT_OFFICIAL_TOKEN}
      - WECHAT_OFFICIAL_AES_KEY=${WECHAT_OFFICIAL_AES_KEY}
      - QQ_BOT_API_URL=${QQ_BOT_API_URL}
      - QQ_BOT_TOKEN=${QQ_BOT_TOKEN}
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-Asia/Shanghai}
    restart: unless-stopped
